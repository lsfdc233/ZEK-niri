# 应用配色模板：Alacritty + cava
#
# 这个文件由 Waybar 的「配色切换」模块（custom/colors-theme）自动控制：
#   启用 → 重命名为 templates-apps.toml
#   禁用 → 重命名为 templates-apps.toml.disabled
#
# 这样一来：
#   切到「Noctalia 自动生成配色」时，会一并渲染并应用 Alacritty / cava 的 Noctalia 模板；
#   切回「手写版配色」时，会撤销并禁用它们，恢复各自原本的主题。

[theme.templates]
enable_builtin_templates = true
builtin_ids = ["alacritty", "cava"]
